[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "repoguard"
version = "0.1.0"
description = "Repository VAPT Security Scanner"
authors = [
    {name = "Lekhraj Singh"}
]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.25.0",
    "jinja2>=3.1.2",
    "pydantic>=2.0.0",
    "rich>=13.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "bandit>=1.7.5",
    "pip-audit>=2.6.0",
    "semgrep>=1.40.0"
]

[project.scripts]
repoguard = "repoguard.cli:main"

[tool.setuptools.packages.find]
include = ["repoguard*"]
